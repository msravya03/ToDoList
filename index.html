<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attractive To-Do List - Smart AI Task Manager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Authentication Section -->
    <div id="auth-section" class="auth-container">
      <!-- Login Form -->
      <div id="login-container" class="auth-form">
        <h1>Welcome Back!</h1>
        <form id="login-form">
          <input
            type="text"
            id="login-username"
            placeholder="Username"
            required
          />
          <input
            type="password"
            id="login-password"
            placeholder="Password"
            required
          />
          <button type="submit">Login</button>
          <div id="login-error" class="error-message"></div>
        </form>
        <p>Don't have an account? <a href="#" id="show-register">Sign up</a></p>
      </div>

      <!-- Register Form -->
      <div id="register-container" class="auth-form" style="display: none">
        <h1>Create Account</h1>
        <form id="register-form">
          <input
            type="text"
            id="register-username"
            placeholder="Choose Username"
            required
          />
          <input
            type="password"
            id="register-password"
            placeholder="Choose Password"
            required
          />
          <button type="submit">Register</button>
          <div id="register-error" class="error-message"></div>
        </form>
        <p>Already have an account? <a href="#" id="show-login">Login</a></p>
      </div>
    </div>

    <!-- Main App Section -->
    <div id="app-section" class="container" style="display: none">
      <!-- Header -->
      <div class="header">
        <div>
          <h1>My To-Do List</h1>
          <p class="subtitle">Powered by On-Device ML Categorization</p>
        </div>
        <div class="user-info">
          <span id="welcome-user"></span>
          <button id="logout-btn" class="logout-btn">Logout</button>
        </div>
      </div>

      <!-- Add Todo Form with Due Date & ML inference -->
      <form id="todo-form" class="todo-add-form">
        <div class="form-inputs-row">
          <input
            type="text"
            id="todo-input"
            placeholder="What needs to be done?..."
            autocomplete="off"
            required
          />
          <div class="due-date-field">
            <input
              type="date"
              id="todo-due-date"
              title="Select due date (optional)"
            />
          </div>
          <button type="submit" id="add-btn">Add Task</button>
        </div>

        <!-- Live Real-Time ML Categorization Preview -->
        <div id="ai-live-preview" class="ai-live-preview" style="display: none">
          <span class="ai-pill-tag">
            <span class="ai-sparkle">🤖 AI Model:</span>
            <span id="preview-category-badge" class="badge"></span>
            <span id="preview-priority-badge" class="badge"></span>
            <span id="preview-confidence" class="confidence-text"></span>
          </span>
        </div>
      </form>

      <!-- Search and Filtering Section -->
      <div class="filter-section">
        <div class="search-box-wrapper">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="todo-search"
            placeholder="Search tasks by title, keyword, or category..."
            autocomplete="off"
          />
          <button
            type="button"
            id="search-clear-btn"
            class="clear-icon-btn"
            style="display: none"
            title="Clear search"
          >
            ✕
          </button>
        </div>

        <div class="filters-row">
          <div class="filter-group">
            <label for="filter-status">Status</label>
            <select id="filter-status">
              <option value="all">All Statuses</option>
              <option value="active">Active Only</option>
              <option value="completed">Completed</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filter-category">Category</label>
            <select id="filter-category">
              <option value="all">All Categories</option>
              <option value="Work">Work</option>
              <option value="Personal">Personal</option>
              <option value="Shopping">Shopping</option>
              <option value="Health">Health</option>
              <option value="Finance">Finance</option>
              <option value="Education">Education</option>
              <option value="General">General</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filter-priority">Priority</label>
            <select id="filter-priority">
              <option value="all">All Priorities</option>
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="sort-by">Sort By</label>
            <select id="sort-by">
              <option value="priority">Priority (High → Low)</option>
              <option value="dueDate">Due Date (Earliest)</option>
              <option value="newest">Newest First</option>
              <option value="alphabetical">Title (A → Z)</option>
            </select>
          </div>
        </div>

        <!-- Task Stats and Active Filter Reset -->
        <div class="task-stats-bar">
          <span id="task-stats-text">Showing 0 tasks</span>
          <button
            type="button"
            id="reset-filters-btn"
            class="reset-filters-btn"
            style="display: none"
          >
            Reset Filters
          </button>
        </div>
      </div>

      <!-- Todo List -->
      <ul id="todo-list"></ul>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
